<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrailTales — Your Daily AI Adventure</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #1f2933;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #5f6b66;
        }

        .story-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .label {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b7280;
        }

        #story {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-line;
        }

        #title {
            font-size: 28px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        #generated {
            margin-top: 25px;
            font-size: 13px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            color: #6b7280;
        }

        .error {
            text-align: center;
            color: #b91c1c;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="hero">
            <h1>🏔️ TrailTales</h1>
            <p>Your Daily AI Adventure</p>
        </div>

        <div class="story-card">

            <div class="label">Today's Adventure</div>

            <h2 id="title">Loading...</h2>

            <div id="story" class="loading">
                Fetching today's adventure...
            </div>

            <div id="generated"></div>

        </div>

        <div class="footer">
            Powered by Amazon Bedrock • Nova Micro • AWS Lambda • Amazon S3
        </div>

    </div>

   <script>
    async function loadStory() {
        try {
            const response = await fetch("daily-story.json");

            if (!response.ok) {
                throw new Error("Story could not be loaded.");
            }

            const data = await response.json();

            document.getElementById("title").textContent =
                "Today's Adventure";

            document.getElementById("story").textContent =
                data.content || "No story available.";

            if (data.generated_at) {
                const date = new Date(data.generated_at);

                document.getElementById("generated").textContent =
                    "Generated: " + date.toLocaleString();
            }

            document.getElementById("story").classList.remove("loading");

        } catch (error) {
            document.getElementById("title").textContent =
                "Today's Adventure";

            document.getElementById("story").textContent =
                "Unable to load today's adventure.";

            document.getElementById("story").className = "error";

            console.error(error);
        }
    }

    loadStory();
</script>

</body>
</html>
